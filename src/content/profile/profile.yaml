about:
  - >-
    I'm a full-stack software engineer working independently with clients from
    Costa Rica. Since 2020 I've delivered enterprise applications as a
    contractor, which means I'm used to owning a problem end to end: scoping it,
    building the backend and the interface, and shipping it into production.
  - >-
    Most of my work lives in the .NET ecosystem — C#, ASP.NET Core, the ABP
    Framework and Entity Framework Core over SQL Server — and I pair it with
    React, Next.js and TypeScript on the front end. Lately that has meant
    logistics workflows: fleet coordination, partial deliveries, signed
    checklists, and integrations with external systems over REST.
  - >-
    If you have a process that still runs on spreadsheets and email, or an
    application that has outgrown the way it was first built, that's the kind of
    work I enjoy most.
